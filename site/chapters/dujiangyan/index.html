    <main class="experience">
      <section class="map-stage" aria-labelledby="map-title">
        <div class="map-heading">

        <svg
          class="story-map"
          viewBox="0 0 1000 760"
          role="img"
          aria-labelledby="svg-title svg-desc"
        >
          <title id="svg-title">都江堰文学地图</title>
          <desc id="svg-desc">随着阅读章节推进，岷江、鱼嘴、飞沙堰、宝瓶口与青城山逐层显影。</desc>

          <defs>
            <filter id="ink-bleed" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence baseFrequency="0.012 0.08" numOctaves="2" seed="11" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.6" />
            </filter>
            <filter id="soft-ink" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="1.7" />
            </filter>
            <linearGradient id="river-fade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#607f8b" stop-opacity=".12" />
              <stop offset="35%" stop-color="#365f70" stop-opacity=".9" />
              <stop offset="100%" stop-color="#244858" stop-opacity=".68" />
            </linearGradient>
            <linearGradient id="terrain-west-fade" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="white" stop-opacity="1" />
              <stop offset="48%" stop-color="white" stop-opacity=".9" />
              <stop offset="78%" stop-color="white" stop-opacity=".26" />
              <stop offset="100%" stop-color="white" stop-opacity="0" />
            </linearGradient>
            <filter id="terrain-edge-blur" x="-10%" y="-10%" width="120%" height="120%">
              <feGaussianBlur stdDeviation="15" />
            </filter>
            <mask id="terrain-hillshade-mask" maskUnits="userSpaceOnUse" x="243.8" y="54" width="708.4" height="654">
              <rect
                x="251"
                y="61"
                width="694"
                height="640"
                rx="8"
                fill="url(#terrain-west-fade)"
                filter="url(#terrain-edge-blur)"
              />
            </mask>
            <pattern id="field-lines" width="42" height="28" patternUnits="userSpaceOnUse">
              <path d="M0 0H42M0 0V28" fill="none" stroke="#5d6e61" stroke-opacity=".2" stroke-width=".8" />
            </pattern>
            <path id="quote-path" d="M 110 585 C 320 650, 520 655, 800 590" />
          </defs>

          <g class="terrain-hillshade reveal-layer" data-level="1" aria-hidden="true">
            <image
              href="./assets/dujiangyan-hillshade.png"
              x="243.8"
              y="54"
              width="708.4"
              height="654"
              preserveAspectRatio="none"
              mask="url(#terrain-hillshade-mask)"
            />
          </g>

          <g class="ghost-contours" aria-hidden="true">
            <path id="terrain-contours-low" />
            <path id="terrain-contours-high" class="contours-high" />
          </g>

          <g class="terrain-caption reveal-layer" data-level="1" aria-hidden="true">

            <text x="190" y="200" class="terrain-label label-en">Min Mountains</text>
          </g>

          <g class="river-system" filter="url(#ink-bleed)">
            <g class="reveal-layer source-river" data-level="1">
              <path id="local-min-shadow" class="river-shadow" d="M418 -55C447 85 398 156 432 255C468 361 432 409 469 506" />

              <path id="local-primary-canals" class="canal fine" />
              <path id="local-secondary-canals" class="canal hairline" />
            </g>
          </g>

          <g class="chengdu-plain reveal-layer" data-level="4" aria-hidden="true">

            <text x="830" y="625" class="plain-title label-cn">成都平原</text>
            <text x="830" y="625" class="plain-title label-en">Chengdu Plain</text>

              <circle r="15" />
              <circle class="site-core" r="3" />
              <text x="25" y="-9" class="label-cn">都江堰</text>
              <text x="25" y="10" class="label-en">Dujiangyan</text>
            </g>
            <g id="qingcheng-point" class="map-point reveal-layer" data-level="4" data-section-target="3" transform="translate(864 535)">
              <circle r="18" />
              <path d="M-7 6L0-7L7 6" />
              <text x="28" y="-11" class="label-cn">青城山</text>
              <text x="28" y="-11" class="label-en">Qingcheng</text>
            </g>

            <g class="engineering-inset reveal-layer" data-level="2" transform="translate(650 76)">
              <rect width="304" height="208" rx="2" />
              <text x="18" y="25" class="inset-kicker">31.00° N · Engineering detail</text>
              <text x="18" y="48" class="inset-title label-cn">水利工程放大图</text>
              <text x="18" y="48" class="inset-title label-en">Dujiangyan Waterworks</text>
              <g transform="translate(10 24)">

                  <text x="12" y="-4" class="label-en">Baopingkou</text>
                </g>
              </g>
            </g>
          </g>

            <text id="outer-label" x="115" y="661" class="water-label label-cn reveal-layer" data-level="2">外江 · 金马河</text>
            <text id="outer-label-en" x="115" y="661" class="water-label label-en reveal-layer" data-level="2">Outer River · Jinma River</text>
            <text id="inner-label" x="734" y="663" class="water-label label-cn reveal-layer" data-level="2">内江</text>
            <text id="inner-label-en" x="734" y="663" class="water-label label-en reveal-layer" data-level="2">Inner River</text>

                拜水都江堰，问道青城山

            </text>
          </g>
